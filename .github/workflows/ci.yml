name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test (offscreen; never touches a real clipboard or hotkeys)
        run: python -m pytest -q -p no:cacheprovider

  installer:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build tools
        run: |
          python -m pip install PySide6-Essentials pyinstaller
          choco install innosetup --no-progress -y
      - name: Build Nexus.exe and installer
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Python python
      # Kept as a build artifact: releases are published by hand after the installer is tested.
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: nexus-installer
          path: |
            dist-installer/Nexus-Setup-*.exe
            dist-installer/Nexus-Setup-*.exe.sha256
