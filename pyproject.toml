[project]
name = "nexus-clipboard"
version = "0.5.0rc1"
description = "Nexus clipboard manager for Windows and Linux (Wayland)"
requires-python = ">=3.11"
# Only QtCore/QtGui/QtWidgets (+QtDBus on Linux) are imported: the Essentials wheel is enough.
# The "PySide6" meta-package would also pull WebEngine, Addons and Pdf (hundreds of MB, unused).
dependencies = [
    "PySide6-Essentials>=6.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nexus-linux = "nexus.platform.linux.app:main"

# A GUI-subsystem launcher: starting Nexus never opens (or shows the icon of) a console.
[project.gui-scripts]
nexus-windows = "nexus.platform.windows.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexus = ["ui/assets/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
