[project]
name = "nexus-linux"
version = "0.1.0"
description = "Nexus clipboard manager, ported to Linux/KDE Plasma from the macOS Swift original"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "dbus-next>=0.2",
    "qasync>=0.27",
    "evdev>=1.6",
]

[project.scripts]
nexus-linux = "nexus_linux.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
