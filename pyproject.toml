[project]
name = "nexus-linux"
version = "1.0.0rc1"
description = "Nexus clipboard manager, for Arch Linux, Hyprland and Caelestia"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "dbus-next>=0.2",
    "qasync>=0.27",
    "evdev>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nexus-linux = "nexus_linux.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
