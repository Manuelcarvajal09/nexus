[project]
name = "nexus-windows"
version = "0.1.0"
description = "Nexus clipboard manager for Windows"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nexus-linux = "nexus_linux.app:main"

# A GUI-subsystem launcher: starting Nexus never opens (or shows the icon of) a console.
[project.gui-scripts]
nexus-windows = "nexus_linux.windows_app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexus_linux = ["assets/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
